<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NEON DRIFT</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <!-- IN-GAME CONTROL BAR -->
  <div id="hudbar" class="hudbar hidden">
    <button id="btnPause" class="chip" type="button">PAUSE</button>
    <button id="btnStop" class="chip danger" type="button">STOP</button>
  </div>

  <!-- START -->
  <div id="start" class="overlay">
    <h1>NEON DRIFT</h1>
    <p class="tag">survive the grid</p>
    <div class="controls">
      <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move</div>
      <div><kbd>MOUSE</kbd> aim &nbsp;·&nbsp; <kbd>HOLD LMB</kbd> fire</div>
      <div><kbd>SPACE</kbd> dash &nbsp;·&nbsp; <kbd>ESC</kbd> pause</div>
    </div>
    <button id="play">enter the grid</button>
  </div>

  <!-- LEVEL UP -->
  <div id="upgrade" class="overlay hidden">
    <h2>level up</h2>
    <p>choose your upgrade</p>
    <div id="cards" class="cards"></div>
  </div>

  <!-- PAUSE -->
  <div id="pause" class="overlay hidden">
    <h2>paused</h2>
    <p>press esc to resume</p>
    <div class="row">
      <button id="btnResume" type="button">resume</button>
      <button id="btnEnd" class="ghost" type="button">end run</button>
    </div>
  </div>

  <!-- GAME OVER -->
  <div id="gameover" class="overlay hidden">
    <h1>signal lost</h1>
    <div class="stats" id="finalStats"></div>
    <div class="row">
      <button id="restart" type="button">run it back</button>
      <button id="btnMenu" class="ghost" type="button">main menu</button>
    </div>
  </div>

  <script src="js/core.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
